services:
  - type: web
    name: ai-attendance-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_SQLITE
        value: "true"
      - key: SECRET_KEY
        value: supersecretkey123
      - key: AI_SERVICE_URL
        value: http://ai-attendance-ai-service:5000

  - type: web
    name: ai-attendance-ai-service
    env: docker
    region: singapore
    rootDir: ai-service
